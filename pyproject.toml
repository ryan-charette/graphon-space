[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphon-space"
version = "0.1.0"
description = "Numerical exploration of graphon feasible regions and entropy maximizers in edge-subgraph density space."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "pyarrow>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
graphon-space = "graphon_space.cli:main"

[tool.setuptools.packages.find]
include = ["graphon_space*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
